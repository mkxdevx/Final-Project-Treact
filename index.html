<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treact</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section id="landing">
        <nav>
            <div class="row nav__row">
                <div class="nav__logo">
                        <img src="./assets/logo.2c489fc453a1783cbadacf914efa3df6.svg" class="nav__logo--img" alt="Treact Logo">
                    <div class="nav__logo--title">
                        Treact
                    </div>
                </div>
                <div class="nav__links">
                    <a href="#" class="nav__link">About</a>
                    <a href="#" class="nav__link">Blog</a>
                    <a href="#" class="nav__link">Pricing</a>
                    <a href="#" class="nav__link">Contact Us</a>
                    <a href="#" class="nav__link login">Login</a>
                    <a href="#" class="nav__link nav__link--primary">Sign Up</a>
                </div>
            </div>
        </nav>
        <header>
            <div class="container">
                <div class="row header__row">
                    <div class="header__description">
                        <h2 class="header__description--title">
                            Beautiful React Templates <span class="purple">for you.</span>
                        </h2>
                        <p class="header__description--para">
                            Our templates are easy to setup, understand and customize. Fully modular components with a variety of pages and components.
                        </p>
                        <div class="header__email">
                            <input type="email" class="header__email--input" placeholder="Your E-mail Address">
                            <button class="header__btn">Get Started</button>
                        </div>
                        <div class="header__customers">
                            <h2 class="header__customers--title">
                                OUR TRUSTED CUSTOMERS
                            </h2>
                            <img src="./assets/customers-logo-strip.680ac7c2e8ae28161d2c.png" alt="Customer's Logos" class="header__customers--img">
                        </div>
                    </div>
                    <figure class="header__img--wrapper">
                        <img src="./assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg" alt="" class="header__img">
                    </figure>
                </div>
            </div> 
        </header>
    </section>
</body>
</html>
